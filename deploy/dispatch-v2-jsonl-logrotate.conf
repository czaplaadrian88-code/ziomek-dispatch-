# Install outside /etc/logrotate.d as:
#   /etc/logrotate-dispatch-v2-jsonl.conf
# and run only through dispatch-v2-jsonl-logrotate.service.
#
# Every producer takes the stable ``<name>.append.lock`` implemented by
# dispatch_v2.core.jsonl_appender. This file owns only rotation policy. The
# dedicated wrapper replaces the marker below with its canonical, late-bound
# path manifest, holds exactly those locks, rejects open legacy inodes and
# passes the generated config to logrotate. ``copytruncate`` is forbidden.
# Direct invocation of /usr/sbin/logrotate on this template is forbidden.

@@DISPATCH_V2_JSONL_PATHS@@
{
    daily
    rotate 30
    maxsize 100M
    compress
    delaycompress
    missingok
    notifempty
    su root root
    create 0644 root root
    sharedscripts
}
